services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:latest
    container_name: immich-public-proxy
    restart: always
    ports:
      - "3000:3000"
    environment:
      PUBLIC_BASE_URL: https://your-proxy-url.com
      IMMICH_URL: http://your-internal-immich-server:2283
    healthcheck:
      test: curl -sf -m 4 http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s

  # Optional: let visitors send photos back to Immich.
  # Uncomment this service and see https://docs.ipp.nz/visitor-uploads
